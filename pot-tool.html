<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ember Pot payouts</title>
    <style>
      :root { color-scheme: dark; --bg: #0d0a14; --panel: #17121f; --line: #2c2438; --text: #ece6f3; --muted: #a59bb3; --lime: #c6f15a; --red: #ff7a7a; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
      h1 { font-size: 22px; margin: 0 0 4px; color: var(--lime); }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 14px 0; }
      h2 { font-size: 15px; margin: 0 0 8px; }
      p, li { color: var(--muted); }
      label { display: block; margin: 8px 0 4px; }
      input, select { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: #0f0b16; color: var(--text); font: 14px ui-monospace, monospace; }
      button { margin-top: 10px; padding: 8px 14px; border-radius: 8px; border: 0; background: var(--lime); color: #111; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .45; cursor: default; }
      code, .mono { font-family: ui-monospace, monospace; word-break: break-all; }
      .ok { color: var(--lime); } .err { color: var(--red); }
      #out { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ember Pot: test payouts</h1>
      <p>Development only (<code>npm run dev</code>), Arc Testnet. Pays an ended round of an Ember Pot by its own formula:
        anyone may call <code>distribute</code>. Your wallet only pays the gas.</p>
      <section>
        <label for="pot">Ember Pot address</label>
        <input id="pot" value="0xd8cc6ae4e31c11a8c9140b3bf9a77dcf68457098" />
        <label for="players">Players (one address per line)</label>
        <textarea id="players" rows="3" style="width:100%;box-sizing:border-box;background:#0f0b16;color:#ece6f3;border:1px solid #2c2438;border-radius:8px;font:13px ui-monospace,monospace;padding:8px">0x08e4f62eD093124AA3cE257830c81B2bC14A51E9
0xe1ea4C01Ca14e74fEd65c78330990fB85AF5CE43</textarea>
        <button id="connect">Connect wallet (Arc Testnet)</button>
        <p id="wallet" class="mono"></p>
        <button id="load">Show rounds</button>
      </section>
      <section><div id="out"></div><div id="rounds"></div></section>
    </main>
    <script type="module" src="/src/tools/pot-tool.ts"></script>
  </body>
</html>
