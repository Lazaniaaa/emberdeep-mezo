# The settings the Ember Pot was compiled and deployed with (Arc Studio project, Foundry v1.7.1).
# Dependencies: `forge install foundry-rs/forge-std` and OpenZeppelin Contracts 5.1.0 (see README.md).
[profile.default]
src = "."
test = "test"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
]
