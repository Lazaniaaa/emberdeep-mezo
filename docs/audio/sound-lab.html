<title>Emberdeep sound lab</title>
<!--
  Approved audio specification (owner, 2026-10-25). Every sound, ambience and music track
  here is synthesised with Web Audio: no samples, downloads or third-party melodies.
  Port these definitions into src/audio/ exactly (same parameters); open this file in a
  browser to compare. Keys of S match the buttons; mob keys are `<species id>:w|s|d`
  (windup, strike, death).

<style>
:root{--text-primary:#e8e6df;--text-secondary:#a9a69c;--bg-accent:#1d3557;--text-accent:#9cc7ff;--border:#3a3a3a;--surface:#141417}
body{margin:0;padding:16px;background:var(--surface);color:var(--text-primary);font:14px/1.5 system-ui,sans-serif;max-width:720px}
button{background:transparent;color:var(--text-primary);border:1px solid var(--border);border-radius:8px;cursor:pointer}
button:hover{border-color:var(--text-secondary)}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0 0 1rem}
.gr button,.mb button{font-size:13px;padding:6px 8px}
.hd{font-size:13px;color:var(--text-secondary);margin:1.25rem 0 .5rem}
.mb{display:grid;grid-template-columns:130px repeat(3,minmax(0,1fr));gap:8px;align-items:center;margin-bottom:6px;font-size:13px}
.on{background:var(--bg-accent)!important;color:var(--text-accent)!important}
.rw{display:flex;align-items:center;gap:12px;margin:0 0 .6rem;font-size:13px;color:var(--text-secondary)}
.rw input{flex:1}
</style>
</head>

<script>
let A,M,FXB,MUB,MF,REV,NB,AMBB,AG,track=null,step=0,nextT=0,amb=null,ambNodes=[],ambNext=0,light=100,nextHB=0;
const R=(x,p)=>x*(1+(Math.random()*2-1)*p),mt=m=>440*Math.pow(2,(m-69)/12);
function bus(g,w){const b=A.createGain();b.gain.value=g;b.connect(M);const s=A.createGain();s.gain.value=w;b.connect(s);s.connect(REV);return b}
function init(){
if(A){if(A.state==='suspended')A.resume();return}
A=new (window.AudioContext||window.webkitAudioContext)();
const c=A.createDynamicsCompressor();c.threshold.value=-14;c.ratio.value=4;
M=A.createGain();M.gain.value=.9;M.connect(c);c.connect(A.destination);
REV=A.createConvolver();const L=Math.floor(A.sampleRate*2.4),ib=A.createBuffer(2,L,A.sampleRate);
for(let k=0;k<2;k++){const d=ib.getChannelData(k);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3)}
REV.buffer=ib;const rg=A.createGain();rg.gain.value=.5;REV.connect(rg);rg.connect(M);
NB=A.createBuffer(1,A.sampleRate*2,A.sampleRate);const nd=NB.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
FXB=bus(.8,.25);AMBB=bus(.8,.45);
MUB=A.createGain();MUB.gain.value=.55;MF=A.createBiquadFilter();MF.type='lowpass';MF.frequency.value=8800;MF.Q.value=.7;
MF.connect(MUB);MUB.connect(M);const ms=A.createGain();ms.gain.value=.35;MUB.connect(ms);ms.connect(REV);
setInterval(tick,50);
}
function env(g,t,a,d,p){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(d,a+.01))}
function tone(t,o){const os=A.createOscillator(),g=A.createGain(),d=o.d||.1;os.type=o.w||'sine';os.frequency.setValueAtTime(o.f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+d);if(o.det)os.detune.value=o.det;
if(o.vib){const l=A.createOscillator(),lg=A.createGain();l.frequency.value=o.vib;lg.gain.value=o.vd||o.f*.02;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+d+.05)}
let n=os;if(o.lp){const fl=A.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(o.lp,t);if(o.lp2)fl.frequency.exponentialRampToValueAtTime(o.lp2,t+d);n.connect(fl);n=fl}
n.connect(g);g.connect(o.out||FXB);env(g,t,o.a||.005,d,o.g||.1);os.start(t);os.stop(t+d+.05)}
function noise(t,o){const s=A.createBufferSource(),fl=A.createBiquadFilter(),g=A.createGain(),d=o.d||.1;s.buffer=NB;s.loop=true;
fl.type=o.ft||'bandpass';fl.frequency.setValueAtTime(o.f||1000,t);if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+d);fl.Q.value=o.q||1;
s.connect(fl);fl.connect(g);g.connect(o.out||FXB);env(g,t,o.a||.003,d,o.g||.2);s.start(t,Math.random()*1.5);s.stop(t+d+.05)}
function clicks(t,n,span,o){for(let i=0;i<n;i++)noise(t+Math.random()*span,Object.assign({},o,{f:R(o.f,.4),g:R(o.g,.4)}))}
const S={
step:t=>{noise(t,{ft:'lowpass',f:R(650,.2),q:1.2,d:.06,g:.35});tone(t,{f:R(95,.1),f2:55,d:.05,g:.18})},
swing:t=>noise(t,{f:600,f2:2800,q:2.5,d:.16,a:.04,g:.3}),
hit:t=>{noise(t,{f:R(1500,.15),q:.9,d:.07,g:.45});tone(t,{f:R(190,.1),f2:55,d:.13,g:.5})},
kill:t=>{S.hit(t);tone(t+.03,{w:'square',f:320,f2:60,d:.22,g:.07,lp:1600});noise(t+.03,{ft:'lowpass',f:900,f2:200,d:.3,g:.25})},
urn:t=>{tone(t,{f:130,f2:70,d:.08,g:.35});noise(t,{ft:'highpass',f:2200,d:.13,g:.3});for(let i=0;i<6;i++)tone(t+.01+Math.random()*.12,{f:R(2700,.35),d:R(.1,.4),g:.06})},
crate:t=>{noise(t,{f:900,q:1.6,d:.06,g:.6});tone(t,{w:'triangle',f:170,f2:90,d:.12,g:.3});noise(t+.07,{f:R(1300,.2),q:2,d:.05,g:.4});noise(t+.05,{ft:'lowpass',f:600,f2:200,d:.25,g:.3});clicks(t+.08,5,.25,{f:900,q:3,d:.03,g:.2})},
gold:t=>[1950,2550].forEach((f,i)=>{tone(t+i*.07,{f,d:.3,g:.11});tone(t+i*.07,{f:f*2.76,d:.12,g:.04})}),
crystal:t=>{[1568,2349,3136,3951].forEach((f,i)=>tone(t+i*.045,{f,d:1,g:.05,a:.004}));noise(t,{ft:'highpass',f:6000,d:.35,g:.05})},
oil:t=>{tone(t,{f:240,f2:620,d:.07,g:.28});tone(t+.09,{f:360,f2:880,d:.07,g:.22});tone(t+.17,{f:300,f2:700,d:.06,g:.12})},
chest:t=>{tone(t,{w:'sawtooth',f:110,f2:150,d:.3,g:.05,lp:700,vib:11,vd:6});for(let i=0;i<7;i++){const f=R(2200,.25);tone(t+.25+i*.055,{f,d:.25,g:.06});tone(t+.25+i*.055,{f:f*2.76,d:.1,g:.02})}},
hurt:t=>{noise(t,{ft:'lowpass',f:1000,f2:180,d:.28,g:.4});tone(t,{f:150,f2:42,d:.32,g:.55});tone(t,{w:'square',f:75,d:.12,g:.05,lp:500})},
dodge:t=>{noise(t,{f:900,f2:3500,q:3,d:.13,a:.02,g:.25});tone(t+.04,{w:'triangle',f:900,f2:1500,d:.09,g:.05})},
ward:t=>{[1046,1318,1568].forEach(f=>tone(t,{f,d:.7,g:.05,vib:7,vd:6}));noise(t,{ft:'highpass',f:5000,d:.3,g:.06});tone(t,{w:'triangle',f:523,d:.25,g:.12})},
potion:t=>{for(let i=0;i<3;i++)tone(t+i*.08,{f:R(300,.2),f2:R(650,.2),d:.06,g:.18});tone(t+.25,{f:400,f2:950,d:.3,g:.08,vib:9})},
levelup:t=>[523,659,784,1047,1319].forEach((f,i)=>{tone(t+i*.07,{w:'triangle',f,d:.35,g:.08});tone(t+i*.07,{f:f/2,d:.4,g:.04})}),
stairs:t=>{for(let i=0;i<4;i++)S.step(t+i*.17);noise(t+.2,{ft:'lowpass',f:1400,f2:150,d:1,a:.2,g:.25});tone(t+.2,{f:220,f2:70,d:1,g:.12})},
rift:t=>{noise(t,{f:300,f2:4500,q:5,d:1.3,a:.5,g:.22});[392,523,659,784].forEach((f,i)=>tone(t+.15*i,{f,d:1.4,a:.3,g:.05,vib:5}));tone(t+.6,{f:1568,d:1.2,g:.04})},
dark:t=>{tone(t,{w:'sawtooth',f:110,f2:34,d:2.6,g:.13,lp:1400,lp2:90});tone(t,{w:'sawtooth',f:111.5,f2:34.5,d:2.6,g:.1,lp:1400,lp2:90});noise(t,{ft:'lowpass',f:400,f2:80,d:2.2,a:.6,g:.15});tone(t+.1,{f:55,d:2.4,a:.5,g:.3})},
buy:t=>{tone(t,{w:'square',f:1200,d:.035,g:.05,lp:3000});tone(t+.05,{w:'square',f:1600,d:.05,g:.05,lp:3000});S.gold(t+.08)},
mint:t=>[587,740,880,1175,1480].forEach((f,i)=>{tone(t+i*.09,{f,d:.9,g:.06});tone(t+i*.09,{f:f*2.76,d:.3,g:.015})}),
'wickgnaw:w':t=>{noise(t,{ft:'highpass',f:2500,f2:6000,d:.55,a:.45,g:.12});tone(t,{f:180,f2:280,d:.55,a:.4,g:.05})},
'wickgnaw:s':t=>{noise(t,{f:900,f2:250,q:.8,d:.4,a:.02,g:.5});tone(t,{f:120,f2:55,d:.3,g:.35})},
'wickgnaw:d':t=>{noise(t,{ft:'lowpass',f:2500,f2:180,d:.9,g:.22});tone(t,{f:320,f2:70,d:.7,g:.07});clicks(t,4,.4,{ft:'highpass',f:3500,d:.015,g:.08})},
'snaretoad:w':t=>clicks(t,10,.45,{f:3600,q:6,d:.015,g:.35}),
'snaretoad:s':t=>{tone(t,{f:2400,f2:280,d:.13,g:.16});noise(t,{ft:'highpass',f:4000,d:.09,g:.12})},
'snaretoad:d':t=>{noise(t,{ft:'lowpass',f:900,f2:140,d:.22,g:.45});tone(t,{f:320,f2:85,d:.17,g:.22});clicks(t+.05,5,.35,{f:2800,q:5,d:.015,g:.2})},
'cinder-hound:w':t=>{for(let i=0;i<18;i++)noise(t+i/30,{f:R(900,.15),q:.9,d:.025,g:.22*(.5+i/36)})},
'cinder-hound:s':t=>{noise(t,{f:300,f2:2200,q:1.4,d:.32,a:.08,g:.4});for(let i=0;i<10;i++)noise(t+i/45,{f:1400,q:1,d:.018,g:.15})},
'cinder-hound:d':t=>{noise(t,{ft:'lowpass',f:1800,f2:300,d:.4,g:.3});[2637,3136].forEach((f,i)=>tone(t+.08+i*.07,{f,d:.4,g:.025}))},
'chaincoil:w':t=>tone(t,{w:'sawtooth',f:92,f2:125,d:.5,a:.05,g:.06,lp:650,vib:13,vd:7}),
'chaincoil:s':t=>{tone(t,{w:'triangle',f:196,f2:186,d:.4,g:.3});tone(t,{f:392,d:.2,g:.08});noise(t+.02,{f:3200,f2:1800,q:8,d:.3,g:.12})},
'chaincoil:d':t=>{for(let i=0;i<11;i++){const u=t+Math.random()*.55;noise(u,{f:R(2300,.4),q:5,d:.03,g:.4});tone(u,{w:'triangle',f:R(750,.35),d:.05,g:.08})}},
'needle-wraith:w':t=>{[1760,2217,2637,3520].forEach((f,i)=>tone(t+i*.06,{f,d:.45,g:.035}));tone(t,{f:880,d:.55,g:.03,vib:6,vd:12})},
'needle-wraith:s':t=>{tone(t,{w:'square',f:420,f2:2600,d:.13,g:.05,lp:4500});noise(t,{ft:'highpass',f:5000,d:.12,g:.12})},
'needle-wraith:d':t=>[3520,2637,2217,1760,1318].forEach((f,i)=>tone(t+i*.08,{f,d:.9,g:.035})),
'sootplate:w':t=>{noise(t,{ft:'lowpass',f:170,q:1,d:1.1,a:.85,g:.8});tone(t,{f:44,f2:58,d:1.1,a:.85,g:.3})},
'sootplate:s':t=>{tone(t,{f:95,f2:28,d:.55,g:.9});noise(t,{ft:'lowpass',f:1300,f2:180,d:.45,g:.6});clicks(t+.05,8,.4,{f:600,q:2,d:.05,g:.3})},
'sootplate:d':t=>{clicks(t,16,1.1,{f:500,q:2,d:.07,g:.45});noise(t,{ft:'lowpass',f:320,d:1.1,a:.1,g:.35});tone(t,{f:60,f2:30,d:.9,g:.4})},
'hollow-burrower:w':t=>{for(let i=0;i<7;i++){noise(t+i*.055,{f:R(1500,.2),q:4,d:.02,g:.3});tone(t+i*.055,{w:'triangle',f:R(620,.2),d:.03,g:.05})}},
'hollow-burrower:s':t=>[0,.07].forEach(o=>{noise(t+o,{ft:'highpass',f:2600,d:.025,g:.6});tone(t+o,{w:'square',f:1100,f2:650,d:.035,g:.06,lp:3000})}),
'hollow-burrower:d':t=>{noise(t,{f:1800,q:1.5,d:.12,g:.55});tone(t,{w:'triangle',f:520,f2:190,d:.22,g:.15});clicks(t+.1,5,.35,{f:1300,q:4,d:.025,g:.25})},
'fourfold-bell:w':t=>{tone(t,{f:140,f2:430,d:.65,a:.55,g:.2,lp:900});noise(t,{ft:'lowpass',f:300,f2:1000,d:.65,a:.5,g:.08})},
'fourfold-bell:s':t=>{noise(t,{ft:'lowpass',f:2000,f2:400,d:.55,g:.5});tone(t,{f:95,f2:48,d:.22,g:.3});clicks(t+.05,8,.5,{ft:'highpass',f:6000,d:.02,g:.06})},
'fourfold-bell:d':t=>{tone(t,{w:'sawtooth',f:320,f2:75,d:.65,g:.06,lp:700});noise(t,{ft:'lowpass',f:600,f2:100,d:.7,g:.22})},
'rift-leaper:w':t=>[880,1046,880,1174,988].forEach((f,i)=>tone(t+i*.065,{w:'square',f,d:.06,g:.035,lp:2600,vib:30,vd:25})),
'rift-leaper:s':t=>{noise(t,{f:500,f2:3200,q:2,d:.2,a:.03,g:.32});[.12,.15,.18].forEach(o=>noise(t+o,{ft:'highpass',f:3000,d:.02,g:.35}))},
'rift-leaper:d':t=>{tone(t,{f:600,f2:1700,d:.06,g:.2});noise(t+.03,{ft:'lowpass',f:1600,f2:300,d:.3,g:.3});[1174,988,784].forEach((f,i)=>tone(t+.15+i*.07,{w:'square',f,d:.06,g:.025,lp:2200}))},
'cerberus:w':t=>{[62,65.5,93].forEach(f=>tone(t,{w:'sawtooth',f,d:1.3,a:.4,g:.07,lp:420,vib:7,vd:3}));noise(t,{ft:'lowpass',f:250,d:1.3,a:.5,g:.15})},
'cerberus:s':t=>{noise(t,{f:1300,q:1,d:.09,g:.7});tone(t,{f:120,f2:38,d:.4,g:.8});noise(t+.05,{f:300,f2:650,q:1,d:.8,a:.06,g:.45});[70,74].forEach(f=>tone(t+.05,{w:'sawtooth',f,f2:f*.7,d:.8,g:.08,lp:600}))},
'cerberus:d':t=>{S['cerberus:w'](t);tone(t+.3,{f:80,f2:24,d:1.8,g:.8});clicks(t+.4,20,1.4,{f:500,q:2,d:.08,g:.4});noise(t+.3,{ft:'lowpass',f:400,f2:60,d:2,g:.4})}
};
const OLD={hit:[[200,120,.07,'sawtooth',.04,0]],gold:[[880,1320,.08,'square',.04,0]],kill:[[300,60,.18,'sawtooth',.05,0]],warn:[[520,0,.05,'square',.03,0],[520,0,.05,'square',.03,.09]]};
function pl(t,m,d,g){tone(t,{f:mt(m),w:'triangle',d,g,out:MF});tone(t,{f:mt(m+12),d:d*.4,g:g*.25,out:MF})}
function bl(t,m,d,g){tone(t,{f:mt(m),d,g,a:.008,out:MF});tone(t,{f:mt(m)*2.76,d:d*.35,g:g*.2,out:MF});tone(t,{f:mt(m+12),d:d*.6,g:g*.18,out:MF})}
function pd(t,ns,d,g){ns.forEach(m=>[-8,8].forEach(det=>tone(t,{f:mt(m),w:'sawtooth',det,d,a:d*.4,g:g/ns.length,lp:1100,out:MF})))}
function bs(t,m,d,g){tone(t,{f:mt(m),d,g,a:.01,out:MF});tone(t,{f:mt(m),w:'triangle',d:d*.6,g:g*.3,out:MF})}
function ht(t,g){noise(t,{ft:'highpass',f:7500,d:.035,g,out:MF})}
function tm(t,g){tone(t,{f:115,f2:45,d:.35,g,out:MF});noise(t,{ft:'lowpass',f:600,d:.08,g:g*.3,out:MF})}
function sn(t,g){noise(t,{f:1800,q:.8,d:.13,g,out:MF});tone(t,{w:'triangle',f:190,f2:150,d:.08,g:g*.4,out:MF})}
const CM=[74,0,76,78,0,76,74,0,73,0,74,76,0,74,71,0,71,0,74,79,0,78,76,0,76,0,73,69,0,71,73,0,78,0,81,78,0,76,74,0,74,0,78,76,0,74,73,71,71,74,79,0,81,79,78,76,76,0,0,73,0,0,74,0];
const DM=[62,0,65,69,67,65,62,0,65,69,72,69,67,0,64,60,62,65,69,0,70,69,65,62,67,65,62,60,61,0,64,69,74,0,69,65,67,70,69,0,72,69,65,64,67,64,60,0,65,69,74,72,70,0,69,65,67,62,65,64,61,64,69,0];
const DB=[38,34,41,36,38,34,43,33],DC={38:[62,65,69],34:[58,62,65],41:[60,65,69],36:[60,64,67],43:[58,62,67],33:[57,61,64]};
const BL=[[62,65],[63,62],[62,69],[68,67],[65,63],[62,61],[60,62],[61,0]];
const TR={
camp:{sd:60/76/2,len:64,play(s,t){const P=['D','Bm','G','A','D','Bm','G','A'],C={D:[62,66,69],Bm:[59,62,66],G:[55,59,62],A:[57,61,64]},B={D:50,Bm:47,G:43,A:45},bar=s>>3,i=s&7,c=C[P[bar]],sd=this.sd;
if(i==0){pd(t,c,sd*8.5,.07);bs(t,B[P[bar]],sd*3.5,.16)}if(i==4)bs(t,B[P[bar]]+7,sd*3,.09);
pl(t,c[[0,1,2,1,0,2,1,2][i]],sd*1.6,.035);if(CM[s])bl(t,CM[s],sd*3,.06);if(i==2||i==6)ht(t,.012)}},
descent:{sd:60/66/2,len:128,play(s,t){const sd=this.sd,root=DB[(s>>3)%8];
if(s%8==0){pd(t,DC[root],sd*9,.08);bs(t,root+12,sd*7,.18)}
if(s%2==0){const m=DM[(s>>1)%64];if(m)bl(t,m,sd*2.6,.055)}
if(s%2==1)ht(t,.008);if(s%16==0)tm(t,.18);if(s%4==2)bs(t,root+24,sd*.8,.03)}},
boss:{sd:60/132/4,len:128,play(s,t){const sd=this.sd,bar=s>>4,i=s&15,root=[38,38,39,39,38,38,36,37][bar],BP=[0,null,0,12,0,null,0,12,0,null,0,12,0,null,1,null];
if(BP[i]!==null)tone(t,{f:mt(root+BP[i]),w:'sawtooth',d:sd*.9,g:.07,lp:700,lp2:250,out:MF});
if(i==0||i==6||i==10)tm(t,.4);if(i==4||i==12)sn(t,.22);if(i%2==0)ht(t,i%4==0?.02:.012);
if(i==0||i==8){const n=BL[bar][i>>3];if(n)tone(t,{f:mt(n),w:'square',d:sd*8,a:.02,g:.035,lp:1800,vib:5.5,vd:4,out:MF})}
if(i==0)pd(t,[root+24,root+27,root+31],sd*15,.05)}}
};
function loopNoise(o,type,f,q,g,lr,ld){const s=A.createBufferSource();s.buffer=NB;s.loop=true;const fl=A.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const gg=A.createGain();gg.gain.value=g;s.connect(fl);fl.connect(gg);gg.connect(o);s.start();const r=[s];if(lr){const l=A.createOscillator(),lg=A.createGain();l.frequency.value=lr;lg.gain.value=ld;l.connect(lg);lg.connect(fl.frequency);l.start();r.push(l)}return r}
function loopOsc(o,w,f,g,lp,tr){const os=A.createOscillator();os.type=w;os.frequency.value=f;const gg=A.createGain();gg.gain.value=g;let n=os;if(lp){const fl=A.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;os.connect(fl);n=fl}n.connect(gg);gg.connect(o);os.start();const r=[os];if(tr){const l=A.createOscillator(),lg=A.createGain();l.frequency.value=tr;lg.gain.value=g*.6;l.connect(lg);lg.connect(gg.gain);l.start();r.push(l)}return r}
const AMB={
catacombs:{start:o=>loopNoise(o,'bandpass',500,.6,.09,.07,250),gap:()=>R(2.2,.5),ev:t=>{if(Math.random()<.85){const f=R(1700,.3),o={out:AG,f,f2:f*.45,d:.07,g:.05};tone(t,o);if(Math.random()<.35)tone(t+.28,Object.assign({},o,{g:.025}))}}},
mycelium:{start:o=>[...loopOsc(o,'sine',55,.04,0,.2),...loopOsc(o,'sine',82.4,.025,0,.13),...loopNoise(o,'lowpass',700,.7,.025,.05,200)],gap:()=>R(1.6,.5),ev:t=>{if(Math.random()<.6)noise(t,{out:AG,f:R(450,.3),f2:140,q:2,d:.35,a:.12,g:.06});else for(let i=0;i<3;i++)tone(t+i*.09,{out:AG,f:R(260,.2),f2:R(520,.2),d:.06,g:.04})}},
cinderworks:{start:o=>[...loopOsc(o,'sawtooth',55,.05,170),...loopNoise(o,'lowpass',380,.7,.06,.3,120)],gap:()=>R(.18,.6),ev:t=>{noise(t,{out:AG,ft:'highpass',f:R(3500,.3),d:.012,g:R(.06,.6)});if(Math.random()<.04){const f=R(330,.25);tone(t,{out:AG,w:'triangle',f,d:1,g:.05});tone(t,{out:AG,f:f*2.76,d:.6,g:.025});tone(t,{out:AG,f:f*5.4,d:.25,g:.01})}}},
hollowglass:{start:o=>loopNoise(o,'bandpass',2600,.5,.03,.06,900),gap:()=>R(1.8,.5),ev:t=>{const P=[84,86,88,91,93,96],n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++){const f=mt(P[Math.floor(Math.random()*6)]);tone(t+i*.13,{out:AG,f,d:1.8,g:.03});tone(t+i*.13,{out:AG,f:f*2.76,d:.6,g:.008})}}}
};
function heart(t){tone(t,{f:65,f2:42,d:.13,g:.6});tone(t+.21,{f:60,f2:40,d:.12,g:.38})}
function tick(){if(!A)return;const now=A.currentTime;
if(track){const T=TR[track];if(nextT<now)nextT=now+.05;while(nextT<now+.2){T.play(step,nextT);step=(step+1)%T.len;nextT+=T.sd}}
if(amb){const E=AMB[amb];if(ambNext<now)ambNext=now+.1;while(ambNext<now+.2){E.ev(ambNext);ambNext+=E.gap()}}
if(light<=25&&(track||amb)){if(nextHB<now)nextHB=now+.05;while(nextHB<now+.2){heart(nextHB);nextHB+=.95-(25-light)*.014}if(Math.random()<.25)noise(now+.1,{ft:'highpass',f:R(4000,.3),d:.01,g:R(.05,.6)})}}
function stopAmb(){if(!amb)return;const now=A.currentTime;AG.gain.setTargetAtTime(0,now,.3);ambNodes.forEach(n=>{try{n.stop(now+1.5)}catch(e){}});ambNodes=[];amb=null}
function mark(attr,val){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===val))}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;init();const t=A.currentTime+.02;
if(b.dataset.s){S[b.dataset.s](t);return}
if(b.dataset.o){OLD[b.dataset.o].forEach(([f,f2,d,w,g,dl])=>tone(t+dl,{f,f2:f2||undefined,d,w,g,out:M}));return}
if(b.dataset.m){const m=b.dataset.m;if(track===m){track=null;mark('data-m','')}else{track=m;step=0;nextT=t+.05;mark('data-m',m)}return}
if(b.dataset.a){const a=b.dataset.a,was=amb;stopAmb();if(was===a){mark('data-a','');return}AG=A.createGain();AG.connect(AMBB);ambNodes=AMB[a].start(AG);amb=a;ambNext=t+.3;mark('data-a',a)}});
const lt=document.getElementById('lt'),lto=document.getElementById('lto');
lt.addEventListener('input',()=>{light=+lt.value;lto.textContent=light+'%'+(light<=25?' · серцебиття':'');if(MF)MF.frequency.setTargetAtTime(400*Math.pow(22,light/100),A.currentTime,.1)});
document.getElementById('vm').addEventListener('input',e=>{init();MUB.gain.setTargetAtTime(e.target.value/100,A.currentTime,.05)});
document.getElementById('vf').addEventListener('input',e=>{init();FXB.gain.setTargetAtTime(e.target.value/100,A.currentTime,.05)});
</script>
